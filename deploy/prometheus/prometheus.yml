global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Engine layer: vLLM exposes Prometheus metrics natively on /metrics.
  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets: ["vllm:8000"]
        labels:
          instance: vllm-1

  # Mock engine, only reachable when the "mock" compose profile is active.
  - job_name: mock-vllm
    metrics_path: /metrics
    static_configs:
      - targets: ["mock-vllm:18000"]
        labels:
          instance: mock-1

  # Gateway layer: requests, retries, per-backend health and TTFT.
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:9000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
