name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    name: gateway (go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: gateway/go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test (race detector)
        run: go test -race -count=1 ./...

  bench:
    name: bench (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bench/requirements.txt

      - name: install
        run: pip install -r bench/requirements.txt

      - name: unit tests
        run: pytest bench/tests -q

      - name: end-to-end harness smoke test (mock engine)
        run: |
          set -euo pipefail
          python bench/mock_vllm.py --port 18000 --prefill-ms 5 --token-ms 1 &
          MOCK_PID=$!
          trap 'kill "$MOCK_PID" 2>/dev/null || true' EXIT
          sleep 1
          python bench/bench_pro.py \
            --base-url http://127.0.0.1:18000 \
            --model mock-model \
            --concurrency 1,4 \
            --num-requests 10 \
            --max-tokens 16 \
            --warmup 2 \
            --cooldown 0 \
            --output-dir /tmp/bench-results

  deploy:
    name: deploy (compose / prometheus / grafana)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: validate docker-compose
        run: docker compose -f deploy/docker-compose.yml config -q

      - name: validate prometheus config and alert rules
        run: |
          docker run --rm \
            -v "$PWD/deploy/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v2.55.1 \
            promtool check config /etc/prometheus/prometheus.yml

      - name: validate grafana dashboard JSON
        run: |
          python3 - <<'PY'
          import glob, json, sys
          paths = glob.glob("deploy/grafana/dashboards/*.json")
          assert paths, "no dashboards found"
          for p in paths:
              with open(p, encoding="utf-8") as fh:
                  doc = json.load(fh)
              assert doc.get("panels"), f"{p}: no panels"
              print(f"ok {p}: {len(doc['panels'])} panels")
          PY
